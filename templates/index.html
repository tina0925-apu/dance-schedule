<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習時間安排</title>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --accent:#e07a5f; --accent2:#3d405b;
    --green:#cdeac0; --yellow:#fff2b2; --orange:#ffd0a1; --red:#ffb3b3; --gray:#e9e9e9;
    --border:#ddd;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
    background:var(--bg); margin:0; padding:20px; color:#333;
  }
  .wrap{max-width:900px;margin:0 auto;}
  h1{color:var(--accent2); font-size:22px;}
  h2{color:var(--accent2); font-size:18px; margin-top:0;}
  .card{background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 6px rgba(0,0,0,0.06);}
  label{display:block; margin:10px 0 4px; font-weight:bold; font-size:14px;}
  input[type=text], input[type=date], textarea, select{
    width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; font-size:14px;
  }
  button{
    background:var(--accent); color:white; border:none; padding:10px 16px;
    border-radius:8px; cursor:pointer; font-size:14px; margin-top:10px; margin-right:8px;
  }
  button.secondary{background:var(--accent2);}
  button.small{padding:4px 10px; font-size:12px;}
  .row{display:flex; gap:10px; align-items:center; margin-bottom:6px;}
  .row input{flex:1;}
  table{border-collapse:collapse; width:100%; font-size:13px;}
  th,td{border:1px solid var(--border); padding:6px 8px; text-align:center;}
  th{background:#f2ede6;}
  .date-row td:first-child{text-align:left; font-weight:bold;}
  .status-all{background:var(--green);}
  .status-one{background:var(--yellow);}
  .status-two{background:var(--orange);}
  .status-many{background:var(--red);}
  .pill{display:inline-block; padding:2px 8px; border-radius:12px; font-size:12px; margin:2px;}
  .muted{color:#888; font-size:13px;}
  .code-badge{background:var(--accent2); color:white; padding:4px 10px; border-radius:8px; font-size:13px; display:inline-block;}
  .err{color:#c0392b; font-size:13px;}
  .avail-x{background:var(--red); color:#900; font-weight:bold;}
  .avail-partial{background:#fff8dc;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🩰 練習時間安排</h1>
  <div id="app"></div>
</div>

<script>
const app = document.getElementById('app');
let view = 'home';
let sessionCode = '';
let data = null;
let currentPerson = '';
let loadError = '';
let mySessions = [];

function weekdayLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(週${w})`;
}

async function loadSession(code){
  try{
    const res = await fetch(`/api/session/${encodeURIComponent(code)}`);
    if(res.status === 404) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function saveSession(code, obj){
  try{
    const res = await fetch(`/api/session/${encodeURIComponent(code)}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(obj)
    });
    return await res.json();
  }catch(e){ console.error('save failed', e); return null; }
}
async function saveResponse(code, person, responses, sidecam){
  try{
    const res = await fetch(`/api/session/${encodeURIComponent(code)}/response`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({person, responses, sidecam})
    });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ console.error('save failed', e); return null; }
}

async function fetchMySessions(){
  try{
    const res = await fetch('/api/my-sessions');
    mySessions = await res.json();
  }catch(e){ mySessions = []; }
}

function render(){
  if(view==='home') renderHome();
  else if(view==='setup') renderSetup();
  else if(view==='fill') renderFill();
  else if(view==='summary') renderSummary();
}

function renderHome(){
  app.innerHTML = `
    <div class="card">
      <h2>我建立的場次</h2>
      <p class="muted">這份列表只記在這個瀏覽器裡，換電腦或清除瀏覽器資料就會看不到——但場次本身還在，只要記得代碼一樣能打開。</p>
      ${mySessions.length ? mySessions.map(s=>`
        <div class="row"><span>${(s.eventName && s.eventName !== s.code) ? `${s.eventName}（代碼：${s.code}）` : s.code}</span>
          <button class="small" data-code="${s.code}">開啟</button>
        </div>
      `).join('') : `<p class="muted">你還沒有在這個瀏覽器建立過場次。</p>`}
    </div>
    <div class="card">
      <h2>建立新場次</h2>
      <label>場次代碼（自訂一個好記的代碼，會用來分享給大家）</label>
      <input type="text" id="codeInput" value="${sessionCode}">
      ${loadError?`<p class="err">${loadError}</p>`:''}
      <button id="btnCreate">建立新場次</button>
    </div>
    <div class="card">
      <h2>加入 / 查看別人分享給你的場次</h2>
      <p class="muted">只要輸入對方給你的場次代碼即可，不需要任何登入。</p>
      <label>場次代碼</label>
      <input type="text" id="joinCodeInput" placeholder="輸入場次代碼">
      ${loadError?`<p class="err">${loadError}</p>`:''}
      <button id="btnJoin" class="secondary">加入 / 查看此代碼</button>
    </div>
  `;

  document.querySelectorAll('#app [data-code]').forEach(b=>{
    b.onclick = async ()=>{
      sessionCode = b.dataset.code;
      const found = await loadSession(sessionCode);
      if(found){ data = found; view='fill'; render(); }
    };
  });
  document.getElementById('btnCreate').onclick = ()=>{
    const code = document.getElementById('codeInput').value.trim();
    if(!code){ loadError='請先輸入場次代碼'; render(); return; }
    sessionCode = code;
    data = { eventName:'', dates:[], people:[], responses:{}, sidecam:{} };
    loadError='';
    view='setup';
    render();
  };
  document.getElementById('btnJoin').onclick = async ()=>{
    const code = document.getElementById('joinCodeInput').value.trim();
    if(!code){ loadError='請先輸入場次代碼'; render(); return; }
    const found = await loadSession(code);
    if(!found){ loadError='找不到這個場次代碼，請確認代碼是否正確'; render(); return; }
    sessionCode = code;
    data = found;
    loadError='';
    view='fill';
    render();
  };
}

function toLocalISODate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;

}

function computeDateRange(start, end, excluded){
  const dates = [];
  if(!start || !end) return dates;
  let d = new Date(start+'T00:00:00');
  const endD = new Date(end+'T00:00:00');
  if(endD < d) return dates;
  while(d <= endD){
    const iso = toLocalISODate(d);
    if(!excluded.includes(iso)) dates.push(iso);
    d.setDate(d.getDate()+1);
  }
  return dates;
}

function recomputeDates(){
  data.dates = computeDateRange(data.startDate||'', data.endDate||'', data.excludedDates||[]);
}

function renderSetup(){
  data.excludedDates = data.excludedDates || [];
  data.startDate = data.startDate || '';
  data.endDate = data.endDate || '';

  app.innerHTML = `
    <div class="card">
      <h2>建立場次：<span class="code-badge">${sessionCode}</span></h2>
      <label>活動名稱（選填）</label>
      <input type="text" id="eventName" value="${data.eventName||''}" placeholder="例如：10月成發練習">

      <label>練習日期區間</label>
      <div class="row">
        <input type="date" id="startDate" value="${data.startDate}">
        <span>至</span>
        <input type="date" id="endDate" value="${data.endDate}">
      </div>
      <p class="muted">選好開始和結束日期後會自動產生這段期間的所有日期，不用另外按確認。</p>

      <label>要排除的日期（選填，例如放假不練的日子）</label>
      <div class="row">
        <input type="date" id="excludeDate">
        <button class="small" id="addExclude">加入排除</button>
      </div>
      <div id="excludeList"></div>

      <label>目前練習日期（共 ${data.dates.length} 天，自動由上方區間產生）</label>
      <div id="dateList"></div>

      <label>參與人員</label>
      <div id="peopleList"></div>
      <div class="row">
        <input type="text" id="newPerson" placeholder="輸入姓名">
        <button class="small" id="addPerson">新增人員</button>
      </div>

      <button id="saveSetup">儲存並產生場次</button>
    </div>
  `;

  const excludeListEl = document.getElementById('excludeList');
  excludeListEl.innerHTML = data.excludedDates.map((d,i)=>`
    <div class="row"><span>${weekdayLabel(d)}（已排除）</span><button class="small secondary" data-i="${i}">取消排除</button></div>
  `).join('') || `<p class="muted">目前沒有排除日期</p>`;
  excludeListEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    data.excludedDates.splice(+b.dataset.i,1);
    recomputeDates();
    render();
  });

  const dateListEl = document.getElementById('dateList');
  dateListEl.innerHTML = data.dates.map(d=>`
    <div class="row"><span>${weekdayLabel(d)}</span><button class="small secondary" data-date="${d}">排除此日期</button></div>
  `).join('') || `<p class="muted">請先設定上方的日期區間</p>`;
  dateListEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const d = b.dataset.date;
    if(!data.excludedDates.includes(d)) data.excludedDates.push(d);
    recomputeDates();
    render();
  });

  const peopleListEl = document.getElementById('peopleList');
  peopleListEl.innerHTML = data.people.map((p,i)=>`
    <div class="row"><span>${p}</span><button class="small secondary" data-i="${i}" data-type="person">刪除</button></div>
  `).join('');
  peopleListEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    data.people.splice(+b.dataset.i,1); render();
  });

  function tryApplyRange(){
    const s = document.getElementById('startDate').value;
    const e = document.getElementById('endDate').value;
    if(!s || !e) return; // wait until both are picked
    if(e < s){
      alert('結束日期不能早於開始日期');
      return;
    }
    data.startDate = s;
    data.endDate = e;
    recomputeDates();
    render();
  }
  document.getElementById('startDate').onchange = tryApplyRange;
  document.getElementById('endDate').onchange = tryApplyRange;
  document.getElementById('addExclude').onclick=()=>{
    const v = document.getElementById('excludeDate').value;
    if(!v) return;
    if(v < data.startDate || v > data.endDate){
      alert('排除的日期需在已設定的區間內');
      return;
    }
    if(!data.excludedDates.includes(v)) data.excludedDates.push(v);
    recomputeDates();
    render();
  };
  document.getElementById('addPerson').onclick=()=>{
    const v = document.getElementById('newPerson').value.trim();
    if(v && !data.people.includes(v)) data.people.push(v);
    render();
  };
  document.getElementById('saveSetup').onclick=async ()=>{
    data.eventName = document.getElementById('eventName').value.trim();
    if(!data.dates.length){
      alert('請先設定練習日期區間');
      return;
    }
    const saved = await saveSession(sessionCode, data);
    if(saved && !saved.error) data = saved;
    await fetchMySessions();
    view='fill';
    render();
  };
}

function renderFill(){
  const peopleOptions = data.people.map(p=>`<option value="${p}" ${p===currentPerson?'selected':''}>${p}</option>`).join('');
  app.innerHTML = `
    <div class="card">
      <h2>${data.eventName||'練習時間'} <span class="code-badge">${sessionCode}</span></h2>
      <p class="muted">把這個代碼「${sessionCode}」和這個網站連結分享給朋友，請他們打開後輸入代碼填寫。</p>
      <label>你是誰？</label>
      <select id="personSelect">
        <option value="">-- 請選擇 --</option>
        ${peopleOptions}
      </select>
      <div id="fillForm"></div>
      <button id="goSummary" class="secondary">查看目前結果彙整</button>
      <button id="goSetup2" class="secondary">修改日期／人員設定</button>
    </div>
  `;
  document.getElementById('personSelect').onchange = async (e)=>{ currentPerson=e.target.value; const fresh = await loadSession(sessionCode); if(fresh) data = fresh; render(); };
  document.getElementById('goSummary').onclick = async ()=>{ const fresh = await loadSession(sessionCode); if(fresh) data = fresh; view='summary'; render(); };
  document.getElementById('goSetup2').onclick = ()=>{ view='setup'; render(); };

  if(currentPerson){
    const formEl = document.createElement('div');
    if(!data.responses[currentPerson]) data.responses[currentPerson] = {};
    if(!data.sidecam[currentPerson]) data.sidecam[currentPerson] = '';
    formEl.innerHTML = `
      <h2 style="margin-top:20px;">${currentPerson} 可以的時間</h2>
      <table>
        <tr><th>日期</th><th>整天不行</th><th>部分時段可以（可填時間）</th></tr>
        ${data.dates.map(d=>{
          const cur = data.responses[currentPerson][d] || '';
          const isX = cur==='X';
          return `<tr>
            <td>${weekdayLabel(d)}</td>
            <td><input type="checkbox" data-date="${d}" class="xcheck" ${isX?'checked':''}></td>
            <td><input type="text" data-date="${d}" class="notefield" placeholder="例如 19:30後可以" value="${(!isX?cur:'')}" ${isX?'disabled':''}></td>
          </tr>`;
        }).join('')}
      </table>
      <label>是否需要側拍師？（必填）</label>
      <select id="sidecamSelect" required>
        <option value="">-- 請選擇 --</option>
        <option value="要" ${data.sidecam[currentPerson]==='要'?'selected':''}>要</option>
        <option value="不要" ${data.sidecam[currentPerson]==='不要'?'selected':''}>不要</option>
        <option value="看人數" ${data.sidecam[currentPerson]==='看人數'?'selected':''}>先看人數再決定</option>
      </select>
      <button id="submitFill">送出 / 更新我的回覆</button>
    `;
    document.getElementById('fillForm')?.remove();
    document.querySelector('#personSelect').after(formEl);
    formEl.id='fillForm';

    formEl.querySelectorAll('.xcheck').forEach(cb=>{
      cb.onchange = ()=>{
        const dt = cb.dataset.date;
        const noteInput = formEl.querySelector(`.notefield[data-date="${dt}"]`);
        if(cb.checked){ noteInput.disabled = true; noteInput.value=''; }
        else{ noteInput.disabled = false; }
      };
    });

    document.getElementById('submitFill').onclick = async ()=>{
      const sidecamVal = document.getElementById('sidecamSelect').value;
      if(!sidecamVal){
        alert('請選擇是否需要側拍師（此欄位為必填，才能送出）');
        return;
      }
      const mine = {};
      data.dates.forEach(d=>{
        const cb = formEl.querySelector(`.xcheck[data-date="${d}"]`);
        const note = formEl.querySelector(`.notefield[data-date="${d}"]`);
        mine[d] = cb.checked ? 'X' : (note.value.trim()||'');
      });
      const saved = await saveResponse(sessionCode, currentPerson, mine, sidecamVal);
      if(!saved){ alert('儲存失敗，請稍後再試一次。'); return; }
      data = saved; // latest data including everyone else's answers
      alert('已儲存你的回覆！');
    };
  }
}

function renderSummary(){
  const rows = data.dates.map(d=>{
    const unavail = data.people.filter(p=> (data.responses[p]||{})[d] === 'X');
    const notes = data.people.filter(p=>{
      const v=(data.responses[p]||{})[d];
      return v && v!=='X';
    }).map(p=>`${p}: ${data.responses[p][d]}`);
    let cls='status-many';
    if(unavail.length===0) cls='status-all';
    else if(unavail.length===1) cls='status-one';
    else if(unavail.length===2) cls='status-two';
    return {d, unavail, notes, cls};
  });

  const sidecamCounts = {要:0, 不要:0, 看人數:0, 未填:0};
  data.people.forEach(p=>{
    const v = data.sidecam[p];
    if(v==='要') sidecamCounts.要++;
    else if(v==='不要') sidecamCounts.不要++;
    else if(v==='看人數') sidecamCounts.看人數++;
    else sidecamCounts.未填++;
  });

  app.innerHTML = `
    <div class="card">
      <h2>${data.eventName||'練習時間'} 彙整結果 <span class="code-badge">${sessionCode}</span></h2>
      <table>
        <tr><th>日期</th>${data.people.map(p=>`<th>${p}</th>`).join('')}<th>不能來人數</th><th>備註</th></tr>
        ${rows.map(r=>`
          <tr class="date-row ${r.cls}">
            <td>${weekdayLabel(r.d)}</td>
            ${data.people.map(p=>{
              const v=(data.responses[p]||{})[r.d]||'';
              const c = v==='X' ? 'avail-x' : (v?'avail-partial':'');
              return `<td class="${c}">${v}</td>`;
            }).join('')}
            <td>${r.unavail.length}</td>
            <td style="text-align:left;">${r.notes.join('；')||''}</td>
          </tr>
        `).join('')}
      </table>

      <h2 style="margin-top:20px;">快速分類</h2>
      <p><span class="pill status-all">全員都可以</span>
        ${rows.filter(r=>r.unavail.length===0).map(r=>weekdayLabel(r.d)).join('、') || '（無）'}</p>
      <p><span class="pill status-one">只有 1 人不行</span>
        ${rows.filter(r=>r.unavail.length===1).map(r=>`${weekdayLabel(r.d)}(${r.unavail.join(',')})`).join('、') || '（無）'}</p>
      <p><span class="pill status-two">只有 2 人不行</span>
        ${rows.filter(r=>r.unavail.length===2).map(r=>`${weekdayLabel(r.d)}(${r.unavail.join(',')})`).join('、') || '（無）'}</p>

      <h2 style="margin-top:20px;">側拍師需求統計</h2>
      <p>要：${sidecamCounts.要}人　不要：${sidecamCounts.不要}人　看人數再決定：${sidecamCounts.看人數}人　尚未填寫：${sidecamCounts.未填}人</p>

      <button id="backFill" class="secondary">回填寫頁面</button>
      <button id="refreshBtn">重新整理資料</button>
    </div>
  `;
  document.getElementById('backFill').onclick=()=>{ view='fill'; render(); };
  document.getElementById('refreshBtn').onclick=async ()=>{
    const fresh = await loadSession(sessionCode);
    if(fresh){ data = fresh; render(); }
  };
}

async function init(){
  await fetchMySessions();
  render();
}
init();
</script>
</body>
</html>
